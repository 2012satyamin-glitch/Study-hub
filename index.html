
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub | Satyam Vishwakarma</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>📚 Study Hub</h1>
    <p>Your learning space | Class 9–12</p>
    <p>Admin: Satyam Vishwakarma</p>
  </header>

  <main>
    <section class="card">
      <h2>Select Your Class</h2>
      <div class="classes">
        <button class="class-btn" data-class="9">Class 9</button>
        <button class="class-btn" data-class="10">Class 10</button>
        <button class="class-btn" data-class="11">Class 11</button>
        <button class="class-btn" data-class="12">Class 12</button>
      </div>
    </section>

    <section class="card">
      <h2 id="materialsTitle">Study Materials</h2>
      <input id="search" type="search" placeholder="Search PDFs...">
      <div id="materials">
        <p class="muted">Select a class to view PDFs.</p>
      </div>
    </section>

    <section class="card">
      <h2>Admin Upload</h2>
      <p class="muted">Admin login and PDF upload will be connected in the next step.</p>
    </section>
  </main>

  <footer>© 2026 Study Hub</footer>

  <script src="app.js"></script>
</body>
</html>
